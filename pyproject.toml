[project]
name = "scm-forecast"
version = "0.1.0"
description = "Supply-chain demand forecasting + EBO-based inventory optimization (Excel in, CSV out)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "openpyxl>=3.1",
    "statsforecast>=1.7",
    "streamlit>=1.37",
    "plotly>=5.22",
    "typer>=0.12",
]

[project.scripts]
scm-forecast = "scm_forecast.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scm_forecast"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "C408"]
